<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bella Chou | 2027 Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #4d4d6a; font-family: 'Inter', sans-serif; color: #d6d0e9; user-select: none; }
        canvas { display: block; outline: none; cursor: grab; }
        canvas:active { cursor: grabbing; }
        
        /* Game HUD Overlays */
        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; padding: 2.5rem; display: flex; flex-direction: column; justify-content: space-between; }
        
        .hud-text { font-family: 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.7rem; font-weight: 300; color: #8ab4f8; }
        
        /* Floating Object Label (Dynamic) */
        #target-reticle {
            position: absolute; pointer-events: none; opacity: 0;
            transform: translate(-50%, -50%) scale(0.8);
            transition: opacity 0.2s, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20; display: flex; flex-direction: column; items-center; justify-center;
        }
        #target-reticle.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .reticle-box {
            border: 1px solid rgba(138, 180, 248, 0.5); background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(4px); padding: 8px 16px; border-radius: 4px;
            box-shadow: 0 0 15px rgba(138, 180, 248, 0.2); text-align: center;
        }
        .reticle-line { width: 1px; height: 30px; background: linear-gradient(to bottom, rgba(138,180,248,0.8), transparent); margin: 0 auto; }

        /* Loader */
        #loader { transition: opacity 0.8s; background-color: #020205; }
        .progress-bar { width: 200px; height: 2px; background: #222; margin-top: 1rem; position: relative; overflow: hidden; }
        .progress-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: #8ab4f8; transition: width 0.1s; }
        
        /* Vignette overlay for cinematic feel */
        #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 40%, rgba(2,2,5,0.8) 100%); z-index: 5; }
    </style>
    
    <!-- Import Maps for Modern Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center text-white">
        <div class="hud-text text-sm animate-pulse">INITIATING SPACECRAFT CONTENTS...</div>
        <div class="progress-bar"><div class="progress-fill" id="load-progress"></div></div>
    </div>

    <!-- Cinematic Vignette -->
    <div id="vignette"></div>

    <!-- White Transition Overlay -->
    <div id="transition-overlay" class="fixed inset-0 z-50 bg-white opacity-0 transition-opacity duration-1000 pointer-events-none"></div>

    <!-- Dynamic In-Game Reticle -->
    <div id="target-reticle">
        <div class="reticle-box">
            <div class="text-white font-medium tracking-widest text-sm drop-shadow-md" id="reticle-title">MODULE</div>
            <div class="hud-text text-[10px] mt-1 text-blue-400">CLICK TO ENGAGE</div>
        </div>
        <div class="reticle-line"></div>
    </div>

    <!-- Static HUD UI -->
    <div id="ui-layer">
        <header class="flex justify-between items-start">
            <div>
                <h1 class="text-2xl font-light tracking-tighter text-white drop-shadow-lg">Yuan-Chen Chou<span class="text-blue-500"></span></h1>
                <p class="hud-text mt-2 text-slate-400">Class of 2027 | College Portfolio</p>
            </div>
            <div class="text-right hidden md:block">
                <p class="hud-text text-slate-500">ORBIT: <span id="coord-readout" class="text-white">Circle</span></p>
                <div class="flex items-center gap-2 mt-2 justify-end">
                    <div class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></div>
                    <p class="hud-text text-[10px]">DRAG TO INSPECT</p>
                </div>
                <div class="flex items-center gap-2 mt-2 justify-end">
                    <div class="w-2 h-2 rounded-full bg-orange-500 animate-ping"></div>
                    <p class="hud-text text-[10px]">Click item to observe</p>
                </div>
            </div>
        </header>
    </div>

    <!-- 3D Scene Container -->
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CORE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.015);

        // Cinematic slightly-isometric Perspective Camera
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(-8.5, 7.5, 18.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        
        // Game-like Lighting & Shadows
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 40;
        controls.minDistance = 10;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Lock camera above ground
        controls.target.set(0, 1.6, 0.4); // orbit around the pilot, not the floor

        // --- MATERIALS & LIGHTING ---
        // Soft ambient fill for clay/diorama look
        const hemiLight = new THREE.HemisphereLight(0x8ab4f8, 0x050510, 0.6);
        scene.add(hemiLight);

        // Main sun/moon light casting crisp, soft shadows
        const dirLight = new THREE.DirectionalLight(0xe2e8f0, 1.2);
        dirLight.position.set(15, 25, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Reusable smooth matte material (Clay-like)
        const matteMat = (color) => new THREE.MeshStandardMaterial({ 
            color: color, roughness: 0.9, metalness: 0.0 
        });
        const metalMat = (color) => new THREE.MeshStandardMaterial({ 
            color: color, roughness: 0.4, metalness: 0.6 
        });

        // --- ENVIRONMENT: DEEP SPACE ---
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x070715, 0.015); // Deep space nebula tone

        const spaceGroup = new THREE.Group();
        scene.add(spaceGroup);

        // Distant Planet 1 (Dark)
        const planet1 = new THREE.Mesh(new THREE.SphereGeometry(40, 64, 64), matteMat(0x1a202c));
        planet1.position.set(-90, -30, -120);
        spaceGroup.add(planet1);

        // Distant Planet 2 (Ringed Gas Giant)
        const planet2Group = new THREE.Group();
        planet2Group.position.set(70, 40, -150);
        planet2Group.rotation.x = Math.PI / 6;
        planet2Group.rotation.y = -Math.PI / 8;
        const p2Body = new THREE.Mesh(new THREE.SphereGeometry(18, 32, 32), matteMat(0x1e3a8a));
        const p2Ring = new THREE.Mesh(new THREE.TorusGeometry(26, 1.5, 16, 64), new THREE.MeshStandardMaterial({color: 0x38bdf8, transparent: true, opacity: 0.6}));
        p2Ring.rotation.x = Math.PI / 2;
        planet2Group.add(p2Body, p2Ring);
        spaceGroup.add(planet2Group);

        // Orbiting Satellite
        const satelliteGroup = new THREE.Group();
        const satCore = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2, 16), metalMat(0xe2e8f0));
        const panelMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, metalness: 0.8, roughness: 0.2 });
        const pLeft = new THREE.Mesh(new THREE.BoxGeometry(3, 0.05, 1), panelMat); pLeft.position.x = -2;
        const pRight = new THREE.Mesh(new THREE.BoxGeometry(3, 0.05, 1), panelMat); pRight.position.x = 2;
        const satLight = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: 0xef4444}));
        satLight.position.y = 1.1;
        satelliteGroup.add(satCore, pLeft, pRight, satLight);
        scene.add(satelliteGroup);

        // Starfield & Nebula Dust
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = new Float32Array(3000 * 3);
        for(let i=0; i<9000; i++) starsPos[i] = (Math.random() - 0.5) * 350;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.6 });
        spaceGroup.add(new THREE.Points(starsGeo, starsMat));

        // --- THE DIORAMA: UFO SPACECRAFT PLATFORM ---
        const ufoGroup = new THREE.Group();
        scene.add(ufoGroup);

        // UFO Hull Base (Detailed curving)
        const hullColor = 0x1e293b;
        const ufoBase = new THREE.Mesh(new THREE.CylinderGeometry(8, 3, 3.5, 64), matteMat(hullColor));
        ufoBase.position.y = -1.75;
        ufoBase.castShadow = true; ufoBase.receiveShadow = true;
        ufoGroup.add(ufoBase);
        
        // Hull Ribs (Adding structural detail)
        for(let i=0; i<8; i++) {
            const rib = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.6, 1.5), metalMat(0x0f172a));
            rib.position.y = -1.75;
            rib.position.z = 6;
            rib.rotation.x = Math.PI/8;
            
            const pivot = new THREE.Group();
            pivot.rotation.y = (i * Math.PI) / 4;
            pivot.add(rib);
            ufoGroup.add(pivot);
        }

        const ufoDeck = new THREE.Mesh(new THREE.CylinderGeometry(8.2, 8, 0.5, 64), matteMat(0x334155));
        ufoDeck.position.y = 0.25;
        ufoDeck.castShadow = true; ufoDeck.receiveShadow = true;
        ufoGroup.add(ufoDeck);

        const neonRing = new THREE.Mesh(new THREE.TorusGeometry(8.2, 0.1, 16, 64), new THREE.MeshBasicMaterial({ color: 0x3b82f6 }));
        neonRing.position.y = 0;
        ufoGroup.add(neonRing);

        // UFO Engine Core (Glowing underbelly)
        const engineGlow = new THREE.PointLight(0x60a5fa, 5, 20);
        engineGlow.position.set(0, -3, 0);
        ufoGroup.add(engineGlow);
        const engineCore = new THREE.Mesh(new THREE.SphereGeometry(2.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0x93c5fd }));
        engineCore.position.y = -3;
        engineCore.scale.y = 0.5;
        ufoGroup.add(engineCore);

        // Shared arrays for animation
        const animatedRings = [];
        let holoBaseRef = null;

        // --- INTERACTIVE MODULES ---
        const interactables = [];
        const hitboxMat = new THREE.MeshBasicMaterial({ visible: false });

        // A. THE PILOT'S STATION (About Me / Activities) - the alien, seated and working at the desk.
        //    Local axes: y = 0 is the deck, +Z is the front of the desk (the side that faces the camera).
        const STATION_SCALE = 1.35;
        const stationMount = new THREE.Group(); // fixed placement + size on the deck
        stationMount.position.set(0, 0.5, 1.0);
        stationMount.rotation.y = -0.43; // turn the station to face the opening camera angle
        stationMount.scale.setScalar(STATION_SCALE);
        ufoGroup.add(stationMount);
        const stationGroup = new THREE.Group(); // this is what grows slightly on hover
        stationMount.add(stationGroup);

        const UP = new THREE.Vector3(0, 1, 0);
        const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
        // mesh helper: geometry + material at a position, casting shadows
        function part(geo, mat, x = 0, y = 0, z = 0, shadow = true) {
            const m = new THREE.Mesh(geo, mat);
            m.position.set(x, y, z);
            m.castShadow = shadow; m.receiveShadow = shadow;
            return m;
        }
        // a capsule between two points (this three.js build has no CapsuleGeometry)
        function capsule(a, b, r1, r2, mat) {
            const g = new THREE.Group();
            const d = new THREE.Vector3().subVectors(b, a);
            const len = d.length();
            const cyl = part(new THREE.CylinderGeometry(r2, r1, len, 20), mat);
            cyl.position.copy(a).addScaledVector(d, 0.5);
            cyl.quaternion.setFromUnitVectors(UP, d.clone().normalize());
            g.add(cyl, part(new THREE.SphereGeometry(r1, 20, 14), mat, a.x, a.y, a.z), part(new THREE.SphereGeometry(r2, 20, 14), mat, b.x, b.y, b.z));
            return g;
        }
        function canvasTexture(w, h, draw) {
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const g = c.getContext('2d');
            draw(g, w, h);
            const t = new THREE.CanvasTexture(c);
            t.encoding = THREE.sRGBEncoding;
            return t;
        }

        // ---------- materials ----------
        const skinMat = new THREE.MeshStandardMaterial({ color: 0x34d399, roughness: 0.55, metalness: 0.0 });
        const skinDarkMat = new THREE.MeshStandardMaterial({ color: 0x0f9f76, roughness: 0.6 });
        const suitMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.75 });
        const suitGreyMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.7 });
        const rubberMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.85 });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5, metalness: 0.4 });
        const goldMat = new THREE.MeshStandardMaterial({ color: 0xfab52b, roughness: 0.3, metalness: 0.8 });
        const steelMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.35, metalness: 0.75 });
        const orangeMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.6 });
        const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0x05070d, roughness: 0.05, metalness: 0.2, clearcoat: 1.0, clearcoatRoughness: 0.03 });
        const glowCyan = new THREE.MeshBasicMaterial({ color: 0x7dd3fc });
        const glowBlue = new THREE.MeshBasicMaterial({ color: 0x3b82f6 });

        // ---------- chair: pedestal stool with a low back ----------
        const chairGroup = new THREE.Group();
        chairGroup.position.set(0, 0, -0.7);
        chairGroup.add(
            part(new THREE.CylinderGeometry(0.55, 0.62, 0.08, 40), steelMat, 0, 0.04, 0),
            part(new THREE.CylinderGeometry(0.09, 0.12, 0.52, 20), steelMat, 0, 0.34, 0),
            part(new THREE.CylinderGeometry(0.2, 0.1, 0.08, 24), darkMat, 0, 0.58, 0),
            part(new THREE.CylinderGeometry(0.52, 0.48, 0.12, 40), rubberMat, 0, 0.66, 0)
        );
        const seatTrim = part(new THREE.TorusGeometry(0.52, 0.035, 12, 48), goldMat, 0, 0.71, 0);
        seatTrim.rotation.x = Math.PI / 2;
        const footRing = part(new THREE.TorusGeometry(0.36, 0.025, 10, 40), steelMat, 0, 0.2, 0);
        footRing.rotation.x = Math.PI / 2;
        // low lumbar rest: an arc of a cylinder behind the hips
        const backRest = part(new THREE.CylinderGeometry(0.56, 0.56, 0.26, 32, 1, true, Math.PI - 0.85, 1.7), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85, side: THREE.DoubleSide }), 0, 0.88, 0);
        const backRail = part(new THREE.TorusGeometry(0.56, 0.03, 10, 32, 1.7), goldMat, 0, 1.01, 0);
        backRail.rotation.set(Math.PI / 2, 0, -Math.PI / 2 - 0.85);
        chairGroup.add(seatTrim, footRing, backRest, backRail);
        stationGroup.add(chairGroup);

        // ---------- the alien ----------
        // Local origin = the top of the seat. Everything about the character is built from here.
        const alien = new THREE.Group();
        alien.position.set(0, 0.72, -0.7);
        stationGroup.add(alien);

        // torso: one smooth lathe profile (hips -> waist -> chest -> shoulders -> neck)
        const torsoGroup = new THREE.Group();
        alien.add(torsoGroup);
        const torsoProfile = [[0, 0.02], [0.3, 0.04], [0.4, 0.16], [0.42, 0.34], [0.4, 0.58], [0.37, 0.8], [0.31, 0.95], [0.25, 1.02], [0, 1.03]]
            .map(p => new THREE.Vector2(p[0], p[1]));
        torsoGroup.add(part(new THREE.LatheGeometry(torsoProfile, 40), suitMat));

        // belt + buckle
        const belt = part(new THREE.TorusGeometry(0.415, 0.04, 12, 48), rubberMat, 0, 0.33, 0);
        belt.rotation.x = Math.PI / 2;
        torsoGroup.add(belt, part(new THREE.BoxGeometry(0.13, 0.1, 0.05), goldMat, 0, 0.33, 0.44));
        for (const sx of [-1, 1]) torsoGroup.add(part(new THREE.BoxGeometry(0.09, 0.12, 0.07), suitGreyMat, sx * 0.3, 0.3, 0.31)); // hip pouches

        // chest control unit: bezel, tiny live screen, LEDs, dial
        const chest = new THREE.Group();
        chest.position.set(0, 0.68, 0.385);
        chest.rotation.x = -0.1;
        const chestScreenTex = canvasTexture(128, 64, (g, w, h) => {
            g.fillStyle = '#031022'; g.fillRect(0, 0, w, h);
            g.strokeStyle = '#38bdf8'; g.lineWidth = 3; g.beginPath();
            const pts = [0, 40, 22, 40, 30, 28, 38, 50, 46, 10, 54, 46, 62, 40, 128, 40];
            for (let i = 0; i < pts.length; i += 2) i ? g.lineTo(pts[i], pts[i + 1]) : g.moveTo(pts[i], pts[i + 1]);
            g.stroke();
        });
        chest.add(
            part(new THREE.BoxGeometry(0.36, 0.25, 0.06), darkMat),
            part(new THREE.PlaneGeometry(0.2, 0.1), new THREE.MeshBasicMaterial({ map: chestScreenTex }), -0.055, 0.045, 0.032, false),
            part(new THREE.CylinderGeometry(0.035, 0.035, 0.03, 20).rotateX(Math.PI / 2), goldMat, 0.115, 0.05, 0.035)
        );
        const chestLeds = [0xef4444, 0xfacc15, 0x22c55e, 0x38bdf8].map((c, i) => {
            const led = part(new THREE.SphereGeometry(0.017, 12, 10), new THREE.MeshBasicMaterial({ color: c }), -0.125 + i * 0.05, -0.065, 0.032, false);
            chest.add(led);
            return led;
        });
        chest.add(part(new THREE.BoxGeometry(0.1, 0.025, 0.02), steelMat, 0.11, -0.065, 0.032, false));
        torsoGroup.add(chest);

        // mission patch on the chest (a small ringed planet)
        const patch = new THREE.Group();
        patch.position.set(0.21, 0.9, 0.275);
        patch.rotation.set(-0.5, 0.55, 0);
        const patchRing = part(new THREE.TorusGeometry(0.058, 0.01, 8, 28), goldMat, 0, 0, 0, false);
        const patchOrbit = part(new THREE.TorusGeometry(0.04, 0.005, 6, 24), glowCyan, 0, 0, 0.012, false);
        patchOrbit.rotation.x = 1.1;
        patch.add(part(new THREE.CircleGeometry(0.055, 28), new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.6 }), 0, 0, 0, false), patchRing, patchOrbit,
            part(new THREE.SphereGeometry(0.02, 12, 10), goldMat, 0, 0, 0.012, false));
        torsoGroup.add(patch);

        // suit seams down the sides (thin orange piping) and shoulder stripes
        for (const sx of [-1, 1]) {
            torsoGroup.add(capsule(V3(sx * 0.405, 0.42, 0.1), V3(sx * 0.365, 0.82, 0.08), 0.014, 0.014, orangeMat));
        }

        // life-support backpack: body, two tanks, vents, antenna with a blinking beacon
        const pack = new THREE.Group();
        pack.position.set(0, 0.62, -0.5);
        pack.add(part(new THREE.BoxGeometry(0.58, 0.7, 0.26), suitGreyMat));
        pack.add(part(new THREE.BoxGeometry(0.5, 0.08, 0.28), darkMat, 0, 0.2, 0), part(new THREE.BoxGeometry(0.5, 0.08, 0.28), darkMat, 0, -0.22, 0));
        for (const sx of [-1, 1]) {
            pack.add(capsule(V3(sx * 0.16, -0.24, -0.2), V3(sx * 0.16, 0.24, -0.2), 0.1, 0.1, steelMat));
            const band = part(new THREE.TorusGeometry(0.102, 0.014, 8, 24), orangeMat, sx * 0.16, 0.06, -0.2);
            band.rotation.x = Math.PI / 2;
            pack.add(band, part(new THREE.CylinderGeometry(0.035, 0.035, 0.06, 14), goldMat, sx * 0.16, 0.37, -0.2));
            // air hoses from the pack up to the helmet ring
            const hose = new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(V3(sx * 0.2, 0.33, 0.02), V3(sx * 0.5, 0.62, 0.1), V3(sx * 0.46, 0.44, 0.34)), 20, 0.028, 10), rubberMat);
            hose.castShadow = true;
            pack.add(hose);
        }
        pack.add(part(new THREE.CylinderGeometry(0.008, 0.012, 0.42, 8), steelMat, 0.22, 0.56, 0.02));
        const beacon = part(new THREE.SphereGeometry(0.03, 12, 10), new THREE.MeshBasicMaterial({ color: 0xef4444 }), 0.22, 0.78, 0.02, false);
        pack.add(beacon);
        torsoGroup.add(pack);

        // helmet seal: neck gasket + wide gold ring the glass dome sits on
        torsoGroup.add(part(new THREE.CylinderGeometry(0.5, 0.27, 0.1, 40), suitGreyMat, 0, 1.03, 0));
        const helmetRing = part(new THREE.TorusGeometry(0.525, 0.05, 14, 56), goldMat, 0, 1.085, 0);
        helmetRing.rotation.x = Math.PI / 2;
        const helmetRing2 = part(new THREE.TorusGeometry(0.47, 0.025, 10, 48), darkMat, 0, 1.0, 0);
        helmetRing2.rotation.x = Math.PI / 2;
        torsoGroup.add(helmetRing, helmetRing2);
        for (let i = 0; i < 8; i++) { // ring bolts
            const a = (i / 8) * Math.PI * 2 + 0.39;
            torsoGroup.add(part(new THREE.SphereGeometry(0.018, 8, 8), steelMat, Math.cos(a) * 0.575, 1.085, Math.sin(a) * 0.575, false));
        }

        // legs: thighs along the seat, shins hanging, chunky boots
        for (const sx of [-1, 1]) {
            const hip = V3(sx * 0.2, 0.2, 0.12), knee = V3(sx * 0.25, 0.22, 0.6), ankle = V3(sx * 0.25, -0.34, 0.68);
            alien.add(capsule(hip, knee, 0.15, 0.13, suitMat), capsule(knee, ankle, 0.125, 0.11, suitMat));
            const kneePad = part(new THREE.SphereGeometry(0.1, 16, 12), suitGreyMat, knee.x, knee.y + 0.02, knee.z + 0.08);
            kneePad.scale.set(1, 0.9, 0.6);
            const ankleRing = part(new THREE.TorusGeometry(0.115, 0.022, 10, 28), goldMat, ankle.x, ankle.y + 0.07, ankle.z - 0.01);

        const screens = [
            holoScreen(1.5, 0.75, ecgTex, 0, DESK_Y + 0.62, 0.42, 0),
            holoScreen(0.8, 0.6, barsTex, -1.22, DESK_Y + 0.58, 0.22, 0.5),
            holoScreen(0.8, 0.6, radarTex, 1.0, DESK_Y + 0.98, 0.3, -0.42)
        ];
        // emitter bar the screens rise from
        deskGroup.add(part(new THREE.BoxGeometry(1.6, 0.03, 0.06), darkMat, 0, DESK_Y + 0.015, 0.42), part(new THREE.BoxGeometry(1.5, 0.012, 0.025), glowCyan, 0, DESK_Y + 0.036, 0.42, false));
        const screenGlow = new THREE.PointLight(0x60a5fa, 0.9, 4);
        screenGlow.position.set(0, DESK_Y + 0.6, 0.1);
        deskGroup.add(screenGlow);

        // ---------- hand targets (in the alien's local space) ----------
        const KEY_Y = DESK_Y + 0.07 - 0.72;                     // keyboard height, relative to the seat top
        const KEY_Z = 0.55 - 0.38 + 0.7;                        // keyboard depth, relative to the alien
        const typeTarget = { r: V3(-0.24, KEY_Y, KEY_Z), l: V3(0.24, KEY_Y, KEY_Z) };
        const waveBase = V3(-0.78, 1.42, 0.3);
        const handR = typeTarget.r.clone(), handL = typeTarget.l.clone();
        const poleType = { r: V3(-0.7, -0.7, -0.2), l: V3(0.7, -0.7, -0.2) }, poleWave = V3(-0.9, -0.4, -0.1);
        const poleR = poleType.r.clone();
        let waveAmount = 0, nextBlink = 2.5, blinkT = -1;
        const look = { yaw: 0, pitch: 0 };

        function updateStation(time, dt) {
            const hovering = hoveredObject === stationHitbox && !isTransitioning;
            waveAmount += ((hovering ? 1 : 0) - waveAmount) * Math.min(1, dt * 6);

            // breathing
            const breath = Math.sin(time * 1.6) * 0.012;
            torsoGroup.scale.set(1 + breath, 1 + breath * 0.6, 1 + breath);

            // hands: typing by default, the right hand lifts into a wave when hovered
            const tapR = Math.max(0, Math.sin(time * 11)) * 0.035, tapL = Math.max(0, Math.sin(time * 11 + 2.1)) * 0.035;
            const tr = typeTarget.r, tl = typeTarget.l;
            const wave = V3(waveBase.x + Math.sin(time * 7) * 0.13, waveBase.y + Math.cos(time * 7) * 0.03, waveBase.z);
            handR.set(tr.x + Math.sin(time * 1.3) * 0.07, tr.y + tapR, tr.z + Math.cos(time * 0.9) * 0.03).lerp(wave, waveAmount);
            handL.set(tl.x + Math.sin(time * 1.1 + 1) * 0.07, tl.y + tapL, tl.z + Math.sin(time * 0.8) * 0.03);
            poleR.copy(poleType.r).lerp(poleWave, waveAmount);
            armRight.pose(handR, poleR);
            armLeft.pose(handL, poleType.l);

            // head follows the pointer a little, with an idle sway; tilts when waving
            const wantYaw = THREE.MathUtils.clamp(mouse.x * 0.55, -0.6, 0.6) + Math.sin(time * 0.5) * 0.06;
            const wantPitch = THREE.MathUtils.clamp(-mouse.y * 0.22, -0.2, 0.25) + 0.08 * (1 - waveAmount);
            look.yaw += (wantYaw - look.yaw) * Math.min(1, dt * 4);
            look.pitch += (wantPitch - look.pitch) * Math.min(1, dt * 4);
            headPivot.rotation.set(look.pitch, look.yaw, Math.sin(time * 0.7) * 0.03 + waveAmount * 0.12);

            // blink
            if (blinkT < 0 && time > nextBlink) blinkT = 0;
            let lid = 1;
            if (blinkT >= 0) {
                blinkT += dt;
                lid = Math.max(0.08, Math.abs(blinkT - 0.09) / 0.09);
                if (blinkT > 0.18) { blinkT = -1; lid = 1; nextBlink = time + 2.5 + Math.random() * 3; }
            }
            eyes.forEach(e => { e.scale.y = lid; });

            // antennae sway and their tips pulse
            antennae.forEach((a, i) => {
                a.rotation.z = Math.sin(time * 1.8 + i * 1.7) * 0.09;
                a.rotation.x = Math.cos(time * 1.4 + i) * 0.07;
                a.userData.halo.scale.setScalar(1 + Math.sin(time * 3 + i) * 0.18);
            });

            // suit lights, beacon, steam, holograms
            chestLeds.forEach((led, i) => { led.visible = Math.sin(time * 3 + i * 1.9) > -0.55; });
            beacon.visible = (time % 1.4) < 0.7;
            steam.forEach((p, i) => {
                const k = (time * 0.35 + i / 3) % 1;
                p.position.set(Math.sin(k * 6 + i) * 0.025, 0.17 + k * 0.28, 0);
                p.material.opacity = 0.28 * (1 - k);
                p.scale.setScalar(0.7 + k * 1.3);
            });
            holoPlanet.rotation.y = time * 0.8;
            holoPlanet.position.y = DESK_Y + 0.62 + Math.sin(time * 1.5) * 0.03;
            screens.forEach((s, i) => { s.position.y += Math.sin(time * 1.2 + i * 2) * 0.0006; });
        }

        const stationHitbox = new THREE.Mesh(new THREE.BoxGeometry(4.8 * STATION_SCALE, 3.4 * STATION_SCALE, 3.0 * STATION_SCALE), hitboxMat);
        stationHitbox.position.copy(stationMount.position);
        stationHitbox.position.y += 1.7 * STATION_SCALE;
        stationHitbox.rotation.y = stationMount.rotation.y;
        stationHitbox.userData = { target: 'projects.html', title: 'PROJECTS'};
        ufoGroup.add(stationHitbox);
        interactables.push(stationHitbox);


        // B. DATA CORE (Research) - Cylindrical Holographic Data Core
        const archiveGroup = new THREE.Group();
        archiveGroup.position.set(6.0, 0.5, -0.6);

        // Core Base & Pillar
        const coreBase = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 0.4, 32), metalMat(0x334155));
        coreBase.position.y = 0.2; coreBase.castShadow = true;
        const corePillar = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 3.5, 32), metalMat(0x0f172a));
        corePillar.position.y = 1.8;
        
        // Inner glowing glass tube
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x8b5cf6, transmission: 0.8, opacity: 1, metalness: 0, roughness: 0.1 });
        const glassTube = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 3.2, 32), glassMat);
        glassTube.position.y = 1.8;
        archiveGroup.add(coreBase, corePillar, glassTube);

        const coreLight = new THREE.PointLight(0x8b5cf6, 2, 5);
        coreLight.position.y = 1.8;
        archiveGroup.add(coreLight);

        // Orbital Data Rings
        for(let i=0; i<4; i++) {
            const ringGroup = new THREE.Group();
            ringGroup.position.y = 0.8 + (i * 0.7);
            
            // Physical ring
            const ringGeo = new THREE.TorusGeometry(1.4, 0.05, 16, 64);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, emissive: 0xa855f7, emissiveIntensity: Math.random() * 0.8 + 0.2 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            
            // Orbiting Data Node (small sphere on ring)
            const node = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshBasicMaterial({color: 0xd946ef}));
            node.position.set(1.4, 0, 0);
            
            ringGroup.add(ring, node);
            archiveGroup.add(ringGroup);
            
            // Store for animation
            animatedRings.push({ group: ringGroup, speed: (Math.random() > 0.5 ? 1 : -1) * (1 + i * 0.5) });
        }

        ufoGroup.add(archiveGroup);

        // Archive Hitbox
        const archiveHitbox = new THREE.Mesh(new THREE.BoxGeometry(3.5, 4.5, 3.5), hitboxMat);
        archiveHitbox.position.copy(archiveGroup.position);
        archiveHitbox.position.y += 1.8;
        archiveHitbox.userData = { target: 'research.html', title: 'RESEARCH' };
        ufoGroup.add(archiveHitbox);
        interactables.push(archiveHitbox);


        // C. POTTED CACTUS (Projects) - Cute clay cactus in a terracotta pot
        const cactusGroup = new THREE.Group();
        cactusGroup.position.set(-5.9, 0.5, -0.4);

        const potMat = matteMat(0xc2703d);      // terracotta
        const soilMat = matteMat(0x3b2a20);     // dark soil
        const cactusMat = matteMat(0x2f855a);   // cactus green
        const spikeMat = matteMat(0xfef9c3);    // pale spikes
        const flowerMat = matteMat(0xf472b6);   // pink flower

        // Pot (tapered cylinder) + rim + soil
        const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.4, 0.7, 32), potMat);
        pot.position.y = 0.35; pot.castShadow = true; pot.receiveShadow = true;
        const potRim = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.06, 16, 32), potMat);
        potRim.position.y = 0.68; potRim.rotation.x = Math.PI / 2;
        const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.08, 32), soilMat);
        soil.position.y = 0.71;
        cactusGroup.add(pot, potRim, soil);

        // Main cactus body (rounded capsule made of a cylinder + two sphere caps)
        const cactusBody = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 1.3, 24), cactusMat);
        cactusBody.position.y = 1.4; cactusBody.castShadow = true;
        const cactusTop = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 16), cactusMat);
        cactusTop.position.y = 2.05; cactusTop.castShadow = true;
        cactusGroup.add(cactusBody, cactusTop);

        // Two chubby arms (cylinder + sphere caps, since CapsuleGeometry isn't in this three.js build)
        function makeArmSegment(radius, length, mat) {
            const seg = new THREE.Group();
            const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 16), mat);
            const capTop = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), mat);
            capTop.position.y = length / 2;
            const capBottom = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), mat);
            capBottom.position.y = -length / 2;
            seg.add(cyl, capTop, capBottom);
            seg.traverse(o => { if (o.isMesh) o.castShadow = true; });
            return seg;
        }

        const armLeftCactus = makeArmSegment(0.16, 0.55, cactusMat);
        armLeftCactus.position.set(-0.42, 1.55, 0);
        armLeftCactus.rotation.z = Math.PI / 2.6;
        const armLeftUp = makeArmSegment(0.14, 0.4, cactusMat);
        armLeftUp.position.set(-0.68, 1.95, 0);

        const armRightCactus = makeArmSegment(0.16, 0.55, cactusMat);
        armRightCactus.position.set(0.42, 1.2, 0);
        armRightCactus.rotation.z = -Math.PI / 2.6;
        const armRightUp = makeArmSegment(0.13, 0.35, cactusMat);
        armRightUp.position.set(0.66, 1.55, 0);
        cactusGroup.add(armLeftCactus, armLeftUp, armRightCactus, armRightUp);

        // Tiny spike dots scattered on the body (small cones, cheap & cute)
        const spikeGeo = new THREE.ConeGeometry(0.025, 0.09, 6);
        for (let i = 0; i < 26; i++) {
            const spike = new THREE.Mesh(spikeGeo, spikeMat);
            const yPos = 0.9 + Math.random() * 1.5;
            const angle = Math.random() * Math.PI * 2;
            const radius = 0.36;
            spike.position.set(Math.cos(angle) * radius, yPos, Math.sin(angle) * radius);
            spike.lookAt(spike.position.clone().multiplyScalar(2).setY(yPos));
            spike.rotateX(Math.PI / 2);
            cactusGroup.add(spike);
        }

        // Little flower on top
        const flowerCenter = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), matteMat(0xfacc15));
        flowerCenter.position.y = 2.42;
        cactusGroup.add(flowerCenter);
        for (let i = 0; i < 5; i++) {
            const petal = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), flowerMat);
            const a = (i / 5) * Math.PI * 2;
            petal.position.set(Math.cos(a) * 0.13, 2.42, Math.sin(a) * 0.13);
            petal.scale.set(1, 0.6, 1);
            cactusGroup.add(petal);
        }

        ufoGroup.add(cactusGroup);

        // Cactus Hitbox
        const cactusHitbox = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), hitboxMat);
        cactusHitbox.position.copy(cactusGroup.position);
        cactusHitbox.position.y += 1.2;
        cactusHitbox.userData = {target: 'about.html', title: 'ABOUT ME' };
        ufoGroup.add(cactusHitbox);
        interactables.push(cactusHitbox);


        // --- INTERACTION & LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const reticle = document.getElementById('target-reticle');
        const retTitle = document.getElementById('reticle-title');
        
        let hoveredObject = null;
        let isTransitioning = false;
        let targetCameraPos = new THREE.Vector3();
        let targetLookAt = new THREE.Vector3();

        // Simulate Loading sequence
        let loadProg = 0;
        const loaderInt = setInterval(() => {
            loadProg += Math.random() * 20;
            document.getElementById('load-progress').style.width = Math.min(loadProg, 100) + '%';
            if(loadProg >= 100) {
                clearInterval(loaderInt);
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').remove(), 800);
            }
        }, 100);

        window.addEventListener('mousemove', (e) => {
            if(isTransitioning) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(interactables);

            if (intersects.length > 0) {
                document.body.style.cursor = 'crosshair';
                const hit = intersects[0].object;
                
                if (hoveredObject !== hit) {
                    hoveredObject = hit;
                    
                    // Scale animation
                    hit.scaleTarget = 1.05;

                    // Update UI HUD
                    retTitle.innerText = hit.userData.title;
                    reticle.classList.add('active');
                }
                
                // Pin HUD to 3D object screen coordinates
                const vector = hit.position.clone();
                vector.project(camera);
                const x = (vector.x * .5 + .5) * window.innerWidth;
                const y = (vector.y * -.5 + .5) * window.innerHeight;
                reticle.style.left = `${x}px`;
                reticle.style.top = `${y - 80}px`;

            } else {
                document.body.style.cursor = 'grab';
                reticle.classList.remove('active');
                if (hoveredObject) {
                    hoveredObject.scaleTarget = 1.0;
                    hoveredObject = null;
                }
            }
        });

        // Click to "Magnimize" (Zoom & Redirect)
        window.addEventListener('click', () => {
            if (hoveredObject && !isTransitioning) {
                isTransitioning = true;
                reticle.classList.remove('active');
                
                // Fade out UI and Fade in White Transition
                document.getElementById('ui-layer').style.opacity = '0';
                document.getElementById('transition-overlay').style.opacity = '1';
                
                // Calculate zoom target
                const hitPos = hoveredObject.position.clone();
                targetLookAt.copy(hitPos);
                
                // Move camera closer to the object, slightly elevated
                targetCameraPos.copy(hitPos).add(new THREE.Vector3(0, 3, 6)); 
                
                // Disable orbit controls
                controls.enabled = false;

                // Redirect after cinematic zoom
                setTimeout(() => {
                    window.location.href = hoveredObject.userData.target;
                }, 1200);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- GAME LOOP ---
        const clock = new THREE.Clock();
        let lastTime = 0, frame = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const dt = Math.min(time - lastTime, 0.05);
            lastTime = time;
            frame++;

            // The pilot: typing, breathing, blinking, looking around (and waving when hovered)
            updateStation(time, dt);
            if (frame % 2 === 0) drawEcg(time); // live heart-signal screen, redrawn every other frame

            // Passive Environment Animation
            spaceGroup.rotation.y = time * 0.005; // Slower majestic rotation
            ufoGroup.position.y = Math.sin(time * 1.5) * 0.2; // Hover effect
            if(holoBaseRef) holoBaseRef.rotation.y = time; // Spinning projector

            // Satellite Animation
            satelliteGroup.position.x = Math.cos(time * 0.2) * 60;
            satelliteGroup.position.z = Math.sin(time * 0.2) * 60 - 50;
            satelliteGroup.position.y = Math.sin(time * 0.3) * 10 + 20;
            satelliteGroup.rotation.y = time * 0.5;
            satelliteGroup.rotation.z = time * 0.2;

            // Archive Data Rings Animation
            animatedRings.forEach(item => {
                item.group.rotation.y = time * item.speed;
                // Add a slight wobble to the rings
                item.group.rotation.z = Math.sin(time * 2 + item.speed) * 0.1;
            });

            // Gentle cactus sway
            cactusGroup.rotation.z = Math.sin(time * 1.2) * 0.02;

            // Hover Object Scale Lerp
            interactables.forEach(obj => {
                if(obj.scaleTarget) {
                    // We actually scale the parent group visually, not the hitbox
                    const visualGroup = (obj === stationHitbox) ? stationGroup : (obj === archiveHitbox) ? archiveGroup : cactusGroup;
                    visualGroup.scale.lerp(new THREE.Vector3(obj.scaleTarget, obj.scaleTarget, obj.scaleTarget), 0.1);
                }
            });

            // Cinematic Click Transition (Lerp Camera)
            if(isTransitioning) {
                camera.position.lerp(targetCameraPos, 0.05);
                controls.target.lerp(targetLookAt, 0.08);
            }

            if(!isTransitioning) controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
