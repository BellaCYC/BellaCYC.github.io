<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Ring — procedural Three.js</title>
    <link rel="stylesheet" href="./assets/main.css" />
    <script type="module" src="./assets/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <aside id="panel">
      <h1>Smart Ring</h1>
      <p class="sub">Procedural Three.js reconstruction · approximate</p>
      <div class="row views">
        <button data-view="reference">Reference</button>
        <button data-view="front">Display</button>
        <button data-view="side">Edge</button>
        <button data-view="top">Axis</button>
      </div>
      <label class="row">Explode <input id="explode" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label class="row"><input id="spin" type="checkbox" /> Auto-rotate</label>
      <h2>Parts</h2>
      <ul id="parts"></ul>
      <p id="info"></p>
    </aside>
    
  </body>
</html>
